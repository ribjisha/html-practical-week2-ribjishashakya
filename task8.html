<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Media Hub</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
          rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" href="favicon.png">

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        h1 {
            font-family: 'Poppins', sans-serif;
        }

        iframe, video, audio {
            margin-bottom: 20px;
        }
    </style>

</head>

<body>

    <header>
        <h1>My Media Hub</h1>
        <p>Welcome to my multimedia webpage.</p>
    </header>

    <main>

        <!-- YouTube Video -->
        <section>
            <h2>YouTube Video</h2>

            <iframe
                width="560"
                height="315"
                src="https://www.youtube.com/embed/dQw4w9WgXcQ"
                title="YouTube video"
                allowfullscreen>
            </iframe>
        </section>


        <!-- Local Video -->
        <section>
            <h2>My Local Video</h2>

            <video width="560" controls>

                <source src="demoV.mp4" type="video/mp4">

                <source src="demoV.mp4" type="video/mp4">

                Your browser does not support the video tag.

            </video>
        </section>


        <!-- Audio -->
        <section>
            <h2>My Audio</h2>

            <audio controls>
                <source src="myaudio.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </section>


        <!-- Google Map -->
        <section>
            <h2>PCPS College Location</h2>

            <iframe
                src="https://www.google.com/maps?q=PCPS+College+Kupondole+Nepal&output=embed"
                width="600"
                height="450"
                style="border:0;"
                loading="lazy">
            </iframe>
        </section>


        <!-- External Website -->
        <section>
            <h2>External Webpage</h2>

            <iframe
                src="https://www.wikipedia.org"
                width="600"
                height="400"
                title="Wikipedia">
            </iframe>
        </section>


        <!-- PDF -->
        <section>
            <h2>My PDF Document</h2>

            <embed
                src="document.pdf"
                type="application/pdf"
                width="600"
                height="500">
        </section>

    </main>

    <footer>
        <p>&copy; 2026 My Media Hub</p>
    </footer>

</body>
</html>
