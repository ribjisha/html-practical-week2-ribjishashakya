<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <h1>Student Registration Form</h1>

    <form>

        <!-- Name -->
        <label for="name">Name:</label>
        <input type="text" id="name" name="name">

        <br><br>

        <!-- Email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <br><br>

        <!-- Password -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">

        <br><br>

        <!-- Gender -->
        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>

        <br><br>

        <!-- Interests -->
        <label>Interests:</label>
        <br>

        <input type="checkbox" id="programming" name="interest" value="programming">
        <label for="programming">Programming</label>

        <br>

        <input type="checkbox" id="web" name="interest" value="web">
        <label for="web">Web Development</label>

        <br>

        <input type="checkbox" id="cybersecurity" name="interest" value="cybersecurity">
        <label for="cybersecurity">Cybersecurity</label>

        <br><br>

        <!-- Department -->
        <label for="department">Department:</label>

        <select id="department" name="department">
            <option value="">Select Department</option>
            <option value="computer-science">Computer Science</option>
            <option value="information-technology">Information Technology</option>
            <option value="software-engineering">Software Engineering</option>
            <option value="cybersecurity">Cybersecurity</option>
        </select>

        <br><br>

        <!-- About You -->
        <label for="about">About You:</label>
        <br>

        <textarea id="about" name="about" rows="5" cols="40"
                  placeholder="Write something about yourself..."></textarea>

        <br><br>

        <!-- Submit Button -->
        <input type="submit" value="Submit">

    </form>

</body>
</html>
